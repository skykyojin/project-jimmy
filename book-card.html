<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Card - Novel Lainnya</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">📚 Novelku</div>
            <nav>
                <a href="index.html">Beranda</a>
                <a href="index buku.html">Pustaka</a>
                <a href="login.html">Login</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Selamat Datang di Novelku</h1>
            <p>Baca novel-novel terkenal secara gratis dan kapan saja</p>
        </section>

        <section class="catalog">
            <h2>Koleksi Novel Terbaik</h2>
            <div class="book-grid">

                <div class="book-card">
                    <div class="book-cover">
                        <img src="images.jpg" alt="Buku 6" onerror="this.src='https://via.placeholder.com/200x280/2C5282/FFFFFF?text=Novel+Baru'">
                    </div>
                    <div class="book-info">
                        <h3>Novel Lainnya</h3>
                        <p class="author">Penulis Berbeda</p>
                        <span class="badge">Coming Soon</span>
                        <a href="#" class="btn-read">Segera</a>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Novelku. Dibuat dengan cinta untuk para pembaca.</p>
    </footer>
</body>
</html>
