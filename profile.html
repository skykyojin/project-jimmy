<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Novelku</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">📚 Novelku</div>
            <nav>
                <a href="index.html">Beranda</a>
                <a href="login.html">Login</a>
                <a href="profile.html">Profile</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div class="profile-details">
                    <h2>Pembaca Hebat</h2>
                    <p class="email">pembaca@perpustakaan.id</p>
                </div>
            </div>

            <div class="profile-stats">
                <div class="stat">
                    <h3>5</h3>
                    <p>Buku Sudah Dibaca</p>
                </div>
                <div class="stat">
                    <h3>5</h3>
                    <p>Sedang Dibaca</p>
                </div>
                <div class="stat">
                    <h3>12j</h3>
                    <p>Jam Membaca</p>
                </div>
            </div>

            <div class="reading-list">
                <h3>Daftar Bacaan Terakhir</h3>
                <ul>
                    <li>
                        <span class="book-title">Don Quixote</span>
                        <span class="progress">75%</span>
                    </li>
                    <li>
                        <span class="book-title">Pride and Prejudice</span>
                        <span class="progress">40%</span>
                    </li>
                    <li>
                        <span class="book-title">Moby-Dick</span>
                        <span class="progress">10%</span>
                    </li>
                </ul>
            </div>

            <div class="profile-actions">
                <a href="index.html" class="btn-primary">Kembali ke Katalog</a>
                <button class="btn-secondary">Edit Profile</button>
            </div>
        </div>
    </main>

    <footer>
        <p> 2026 Novelku. Dibuat dengan cinta untuk para pembaca.</p>
    </footer>
</body>
</html>
